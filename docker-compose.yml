services:
  # Message Queue
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    networks:
      - order-network
    healthcheck:
      test: echo ruok | nc localhost 2181 || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      LOG4J_LOGGER_KAFKA_CONTROLLER: WARN
      LOG4J_LOGGER_KAFKA_LOG_CLEANER: WARN
    depends_on:
      zookeeper:
        condition: service_started
    networks:
      - order-network
    # Simple healthcheck that just ensures port is listening
    healthcheck:
      test: nc -z localhost 9092 || exit 1
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 45s

  # Backend Services
  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: order-gateway
    environment:
      GATEWAY_PORT: 3000
      KAFKA_BROKER: kafka:29092
      KAFKA_CLIENT_ID: order-system-gateway
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      kafka:
        condition: service_started
    networks:
      - order-network
    restart: unless-stopped
    healthcheck:
      test: curl -f http://localhost:3000/api/token/demo-user || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  order-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: order
    container_name: order-service
    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_CLIENT_ID: order-system-order
      NODE_ENV: production
    depends_on:
      kafka:
        condition: service_started
    networks:
      - order-network
    restart: unless-stopped

  payment-service:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        SERVICE: payment
    container_name: payment-service
    environment:
      KAFKA_BROKER: kafka:29092
      KAFKA_CLIENT_ID: order-system-payment
      NODE_ENV: production
    depends_on:
      kafka:
        condition: service_started
    networks:
      - order-network
    restart: unless-stopped

  # Frontend Application
  frontend:
    build:
      context: ./frontend/angular-app
      dockerfile: Dockerfile
    container_name: order-frontend
    ports:
      - "4200:4200"
    environment:
      API_BASE_URL: http://gateway:3000
      SOCKET_URL: http://gateway:3000
    depends_on:
      - gateway
    networks:
      - order-network
    restart: unless-stopped
    healthcheck:
      test: wget --quiet --tries=1 --spider http://localhost:4200/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  order-network:
    driver: bridge